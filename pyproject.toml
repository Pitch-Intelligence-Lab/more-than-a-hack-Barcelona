[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mtah-possession"
version = "0.2.0"
description = "Deterministic tactical ATD possession state engine for MTAH 2027."
requires-python = ">=3.12,<3.13"
dependencies = ["numpy==2.5.4"]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "ruff==0.17.3"]

[project.scripts]
mtah-build = "mtah_possession.pipeline.build_submission:main"
mtah-validate = "mtah_possession.validation.submission:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

