name: tests

on:
  pull_request:
  push:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  synthetic-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Synthetic tests with warnings as errors
        run: python -m pytest -q -W error
      - name: Synthetic tests with invalid external root
        env:
          MTAH_EXTERNAL_DATA_DIR: ${{ runner.temp }}/dp006-invalid-external-root
        run: |
          test ! -e "$MTAH_EXTERNAL_DATA_DIR"
          python -m pytest -q -W error
      - name: Ruff check
        run: python -m ruff check .
      - name: Ruff format check
        run: python -m ruff format --check .

